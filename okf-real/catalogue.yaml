# The product catalogue — the only pages that become products.
#
# Supplied by the product owner on 2026-09-03 from the current Etiqa Singapore
# and Tiq by Etiqa websites. The compiler builds one product per entry, from
# the listed pages and from the policy documents whose names match the entry;
# a crawled page that is not listed here is not a product, whatever the crawl
# called it, and a document that matches no entry is reported, not compiled.
#
# Fields:
#   slug      the product key and the page id's last segment (stable — suites
#             and benefit tables are keyed by it)
#   name      the customer-facing name
#   brand     tiq | etiqa
#   category  the site's own grouping
#   status    active | legacy   (legacy: closed to new business; still answered,
#             with a note)
#   urls      official product pages, any host; several when the product is
#             listed on both sites
#   aliases   other names customers use for it
#   documents name keys that identify this product's wordings, summaries and
#             brochures in raw/ (matched against the file's plan name)


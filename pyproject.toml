[project]
name = "etiqa-knowledge-layer"
version = "0.2.0"
description = "Etiqa SG knowledge & harness layer — OKF wiki + RAG + verification gates"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Layout-aware PDF ingestion. Heavy (torch + transformers); the crawler's
# builtin pypdf backend runs without it.
docling = ["docling>=2"]

[tool.uv.workspace]
members = ["packages/okf", "packages/harness", "apps/api", "apps/compiler", "apps/evalgen", "apps/crawler"]

[dependency-groups]
dev = [
    "okf", "harness", "api", "compiler", "evalgen", "crawler",
    "anthropic>=0.40",
    "pypdf>=4",
    "markitdown[pdf]>=0.1",
    "pytest>=8", "pytest-asyncio>=0.24",
    "ruff>=0.6", "mypy>=1.11", "httpx>=0.27", "types-PyYAML",
]

[tool.uv.sources]
okf = { workspace = true }
harness = { workspace = true }
api = { workspace = true }
compiler = { workspace = true }
evalgen = { workspace = true }
crawler = { workspace = true }

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["SIM108", "UP042"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
files = ["packages", "apps", "evals", "scripts"]
# Each package has its own tests/conftest.py; without this they collide on the
# module name "conftest".
explicit_package_bases = true
namespace_packages = true
# `scripts` holds runnable harnesses rather than a package; the tests import
# the backtest from there so the accuracy maths has one implementation.
mypy_path = "packages/okf:packages/harness:apps/api:apps/compiler:apps/evalgen:apps/crawler:scripts:."

[[tool.mypy.overrides]]
module = ["langfuse.*", "psycopg.*", "trafilatura.*", "docling.*", "markitdown.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "apps", "evals"]
addopts = "-q"

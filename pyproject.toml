[project]
name = "etiqa-knowledge-layer"
version = "0.2.0"
description = "Etiqa SG knowledge & harness layer — OKF wiki + RAG + verification gates"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = ["packages/okf", "packages/harness", "apps/api", "apps/compiler", "apps/evalgen"]

[dependency-groups]
dev = [
    "okf", "harness", "api", "compiler", "evalgen",
    "pytest>=8", "pytest-asyncio>=0.24",
    "ruff>=0.6", "mypy>=1.11", "httpx>=0.27", "types-PyYAML",
]

[tool.uv.sources]
okf = { workspace = true }
harness = { workspace = true }
api = { workspace = true }
compiler = { workspace = true }
evalgen = { workspace = true }

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["SIM108", "UP042"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
files = ["packages", "apps", "evals"]
# Each package has its own tests/conftest.py; without this they collide on the
# module name "conftest".
explicit_package_bases = true
namespace_packages = true
mypy_path = "packages/okf:packages/harness:apps/api:apps/compiler:apps/evalgen:."

[[tool.mypy.overrides]]
module = ["langfuse.*", "psycopg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "apps", "evals"]
addopts = "-q"

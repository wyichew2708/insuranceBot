[project]
name = "insurance-clients"
version = "0.1.0"
description = "Typed async clients: vLLM (chat/embed/rerank), Langfuse, Redis, DB"
requires-python = ">=3.11"
dependencies = [
    "contracts",
    "httpx>=0.27",
    "redis>=5",
    "psycopg[binary]>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["insurance_clients"]

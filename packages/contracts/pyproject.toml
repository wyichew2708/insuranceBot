[project]
name = "contracts"
version = "0.1.0"
description = "Shared pydantic models, JSON Schemas, and settings for all insuranceBot services"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contracts"]

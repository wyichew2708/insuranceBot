[project]
name = "okf"
version = "0.2.0"
description = "OKF bundle: page model, frontmatter schema, linter, graph, benefit tables"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "pydantic-settings>=2.3", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["okf"]

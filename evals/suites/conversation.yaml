# The golden conversation dataset — GENERATED, do not edit by hand.
#
#   uv run python scripts/conversation_suite.py --bundle okf-real
#
# Authored source: evals/taxonomy/conversation.yaml — that is the file to
# argue with. It carries the question list *and the contract for a correct
# reply*, which is the half that decides whether a score means anything:
# roughly a third of what customers ask an insurer is not answerable from a
# knowledge corpus at all, and for those the correct behaviour is a handoff.
#
# 1356 cases. Every case carries its journey, intent and entity
# labels; `scripts/conversation_report.py` groups the score by them.
#
# The evaluation date is pinned. okf-real pages are review-due 2026-12-02,
# so a suite that let the session default to the wall clock would start
# failing every case on 2026-12-03 for reasons that are not the bot's.

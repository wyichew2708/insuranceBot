# Merge-consistency suite (§G Loop 3) — the mechanical guarantee that
# "the distribution channel is an attribute, not a product identity" (§B.1)
# held. The same question asked on each route must return identical facts and
# differ only in the rendered deep link.
#
# Etiqa and Tiq are deliberately absent as variants: they are not different
# channels, they are two front doors of `channel/direct`, so there is no
# brand framing left to be inconsistent about. What still varies, and so still
# needs proving, is the route to market.
- id: merge-travel-delay
  type: merge-consistency
  variants:
    - question: How long must a flight be delayed before the travel delay benefit applies?
      channel: channel/direct
      auth_level: L2
      policy_id: TRV-100001
    - question: How long must a flight be delayed before the travel delay benefit applies?
      channel: channel/agency
      auth_level: L2
      policy_id: TRV-100001

- id: merge-travel-medical
  type: merge-consistency
  variants:

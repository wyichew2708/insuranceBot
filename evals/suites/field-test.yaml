- id: ft-hold-helper-is-maid
  turns: ["my helper hurt herself", "how do i claim"]
  expect:
    cite_product: maid-insurance

- id: ft-hold-named-product-ignores-history
  # A turn that names its own product must NOT inherit the conversation's.

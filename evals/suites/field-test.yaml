  expect:
    must_not_contain: ["complimentary home"]

- id: ft-hold-bare-product-name
  # The most ordinary input there is: a product's name and nothing else. On
  # the first v2.1 build it was refused by the entailment judge over a
  # marketing line the composer emitted as a claim.
  question: tiq travel
  expect:
    handoff: false
    cite_product: [travel-insurance, tiq-travel, travel-infinite, travel-takaful]

- id: ft-hold-bare-product-name-coverage
  question: tiq travel coverage
  expect:
    handoff: false
    cite_product: [travel-insurance, tiq-travel, travel-infinite, travel-takaful]

- id: ft-product-brand-plus-category-asks
  # "tiq" is the brand, "travel" the category. The phrase sits inside exactly
  # one title — Tiq Travel Covid Insurance — so it looked unambiguous and was
  # answered with the COVID rider while tiq.com.sg sells plain Travel Insurance.
  # 2026-09-03: "Tiq Travel" is the product's own name on the site that sells
  # it, and the catalogue records it as one. The customer named the product;
  # asking them which they meant was the defect.
  question: tiq travel
  expect:
    clarifying: false
    cite_product: travel-insurance

- id: ft-product-how-to-buy-is-not-cover
  # Answered with 467 words of travel cover because one clause said the Trip
  # was "purchased from a registered Travel Agent", and "purchase" satisfied
  # the application requirement.
  turns: ["travel insurance", "how to buy?"]
  expect:
    must_not_contain: ["irrecoverable travel deposits", "emergency medical evacuation"]

- id: ft-product-buy-names-the-route
  question: how do i buy maid insurance
  expect:
    cite_product: maid-insurance
    must_not_contain: ["scale of compensation"]

# Field test — what four testers found by asking the way customers ask.
#
# The generated suite scores 98% while 21 of 22 ordinary customer conversations
# produced a finding. Both numbers are honest: the generated suite is derived
# *from the corpus*, so it asks questions phrased the way policy documents are
# phrased, and against those retrieval is near-perfect. Customers do not phrase
# things like a policy wording.
#
# This suite is the other half. Every case is a real turn from the field test on
# 2026-08-27, and the expectation encodes what the customer should have got. Most
# of them FAIL on the build that was tested — that is the point. They are the
# instrument for the fixes, and the guard against fixing one class by breaking
# another.
#
# Sections:
#   ft-hygiene-*    build artifacts that must never reach a customer
#   ft-sense-*      answers that inverted or truncated the source
#   ft-product-*    the wrong product, chosen silently
#   ft-topic-*      questions that are not ours to answer
#   ft-safety-*     advice, guarantees, injection, medical
#   ft-hold-*       what already works and must not regress
#
# `turns:` is one conversation; the expectation applies to the last turn.

# ---------------------------------------------------------------- hygiene ---
# None of these strings is content. They are scaffolding the compiler wrote,
# a placeholder for a figure that did not resolve, and an escape sequence that
# survived a JSON round-trip.

- id: ft-hygiene-channel-boilerplate-family
  question: which plan is best for my family
  expect:
    must_not_contain: ["route to market", "a channel is a route"]

- id: ft-hygiene-channel-boilerplate-bike
  question: insurance for my bike
  expect:
    must_not_contain: ["route to market"]

- id: ft-hygiene-channel-boilerplate-burglary
  question: someone broke into my house and took my jewellery
  expect:
    must_not_contain: ["route to market"]

- id: ft-hygiene-compiled-from-boilerplate
  question: insurance
  expect:
    must_not_contain: ["compiled from its policy documents", "the sections below quote it"]

- id: ft-hygiene-compiled-from-life
  turns: ["i want to buy life insurance", "how do i sign up"]
  expect:
    must_not_contain: ["compiled from its policy documents"]

- id: ft-hygiene-unavailable-covid
  question: does travel insurance cover covid
  expect:
    must_not_contain: ["[unavailable]"]

- id: ft-hygiene-unavailable-travel-cover
  question: what does travel insurance cover
  expect:
    must_not_contain: ["[unavailable]"]

- id: ft-hygiene-unavailable-multi-question
  question: what does travel insurance cover and how much is it and how do i buy
  expect:
    must_not_contain: ["[unavailable]"]

- id: ft-hygiene-literal-newline-travel
  question: what does travel insurance cover ah
  expect:
    must_not_contain: ['\n']

- id: ft-hygiene-literal-newline-election
  question: who won the election
  expect:
    must_not_contain: ['\n']

- id: ft-hygiene-stray-faq-header-maid
  question: how much does maid insurance cost?
  expect:
    must_not_contain: ["if so, will i get a refund?"]

- id: ft-hygiene-stray-faq-header-pet
  question: insurance for my dog
  expect:
    must_not_contain: ["if so, will i get a refund?"]

- id: ft-hygiene-dead-link-text
  turns: ["my car got hit by another car", "how long does the claim take"]
  expect:
    must_not_contain: ["click here to make a claim.", "by clicking here"]

# ------------------------------------------------------------------ sense ---
# The source said one thing; the answer said its opposite, or nothing at all.

- id: ft-sense-cancellation-not-coverage
  # `## This Insurance shall be cancelled` + its list. Retrieved without the
  # heading, the cancellation triggers read as benefits.
  question: travel insurance what is covered
  expect:
    cite_product: travel-insurance
    must_not_contain:
      - "covers you upon the death"
      - "covers you if the insured ceases to be eligible"

- id: ft-sense-cancellation-not-coverage-clean
  question: what does travel insurance cover
  expect:
    cite_product: travel-insurance
    must_not_contain: ["covers you upon the death"]

- id: ft-sense-cancer-exclusions-not-empty
  # The whole answer was the lead-in: "...for the following:." The exclusions
  # themselves were dropped at compile time, not mis-retrieved.
  question: what is not covered under cancer insurance
  expect:
    cite_product: cancer-insurance
    must_not_contain: ["for the following:."]
    must_contain: ["waiting period"]

- id: ft-sense-home-exclusions-not-empty
  turns: ["i want cover for my house", "what does it exclude"]
  expect:
    must_not_contain: ["which is in any way due to:.", "in any way due to:."]

- id: ft-sense-no-dangling-colon-flood
  question: my home got flooded, can i claim
  expect:
    must_not_contain: ["the following:."]

- id: ft-sense-claim-question-not-denied
  # Opened with "No." — the answer to an unrelated FAQ about two policies on
  # one property. A yes/no claim question must not open on someone else's "No".
  question: my home water pipe burst, can i claim under my policy
  expect:
    must_not_contain: ["no. each property can only be covered under one active policy"]

# ---------------------------------------------------------------- product ---
# 99 pages tie at an identical score for "how do i make a claim"; 213 for
# "what is covered". The tie is broken alphabetically and every other product
# is then excluded. Where a question genuinely does not separate products the
# honest answer is to ask.

- id: ft-product-bare-claim-asks
  question: how do i make a claim
  expect:
    clarifying: true
    must_not_contain: ["plate glass"]


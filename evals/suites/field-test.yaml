    cite_product: cancer-insurance

- id: ft-hold-house-is-home
  # Won by the model in 215a107; nothing in the corpus is called "house".
  turns: ["i want cover for my house", "what does it exclude"]
  expect:
    # Any of the home products serves this; the point is that "house" reached
    # one at all, when nothing in the corpus is called a house.

# The conversation taxonomy — the authored half of the golden dataset.
#
# `scripts/conversation_suite.py` expands this across the product catalogue
# into `evals/suites/conversation.yaml`, which is the dataset the evaluation
# actually runs. This file is the part a human reviews: it says what a
# customer asks and, for each of those, **what a correct reply is**.
#
# That second half is the point, and it is the half a question list cannot
# carry. Roughly a third of what customers ask an insurer's chatbot is not
# answerable from a knowledge corpus at all — "what is my claim status", "I
# forgot my password", "someone used my policy" — and for those the correct
# reply is a handoff, not an answer. A dataset that expected answers there
# would score the bot highest for its most dangerous behaviour. So every
# template below declares a `contract`, and the contracts are stated once,
# here, where they can be argued with.
#
# ---------------------------------------------------------------------------
# The three layers
#
#   journey   Layer 1 — where in the customer lifecycle this sits
#   intent    Layer 2 — what they want
#   entities  Layer 3 — product line, peril, claim type, context
#
# Every generated case carries all three, and the report groups by them, so a
# score can be read as "claims questions on motor products are weak" rather
# than as one number.
#
# ---------------------------------------------------------------------------
# Scope, and what "all products" means
#
#   scope: global        one case; the question names no product
#   scope: product       one case per product in the catalogue — all 37
#   scope: line:<name>   the products in that line (see `lines` below); one
#                        case against the line's first product unless
#                        `fanout: all`
#
# The `product` scope is deliberately small — fourteen questions — and it is
# the coverage guarantee: every product in the catalogue is asked what it
# covers, what it excludes, how to claim on it, how to buy it, who may buy it,
# what it costs, and eight more. The line scope is where the depth lives,
# because "does it cover skiing" is a travel question and asking it of a
# marine cargo policy tests nothing.
#
# ---------------------------------------------------------------------------
# The evaluation date is pinned
#
# `okf-real` pages carry `effective_from` around 2026-09-03 and `review_due`
# 2026-12-02. A suite that lets the session default to the wall clock passes
# today, fails on 2026-12-03 when every page goes review-overdue, and fails
# again on any machine whose clock is set differently. A golden dataset has to
# give the same answer forever, so the date is a fact of the dataset.

version: 1
evaluation_date: "2026-09-04"

# ---------------------------------------------------------------------------
# Product lines
#
# Grouped by what a customer is asking about, not by the website's marketing
# categories — those file pet and cyber insurance under "Travel & Lifestyle",
# which is true of the shop shelf and useless for deciding whether "does it
# cover my dog's surgery" applies. First entry is the line's flagship and is
# what a non-fanned template runs against.
# ---------------------------------------------------------------------------
lines:
  travel: [travel-insurance, travel-infinite, travel-takaful, corporate-travel]
  motor: [private-car-insurance, motorcycle-insurance, commercial-vehicle]
  home: [home-insurance, fire-insurance, maid-insurance]
  accident: [personal-accident, eprotect-safety, accident-health]
  life: [term-life-insurance, whole-life-insurance, eprotect-term-life,
         direct-etiqa-term-life-ii, direct-etiqa-whole-life]
  health: [cancer-insurance, 3-plus-critical-illness, accident-health]
  savings: [tiq-easy-save, eeasy-savepro, tiq-3-year-endowment-plan, cashsaver, enrich-aspire-vii]
  investment: [tiq-invest, invest-vista, invest-smart-vista]
  business: [business-owners-super-suite, casualty, engineering, marine,
             miscellaneous, property, corporate-travel, commercial-vehicle]
  pet: [pet-insurance]
  cyber: [personal-cyber-insurance]
  maid: [maid-insurance]

# ---------------------------------------------------------------------------
# Behaviour contracts
#
# Named once so the policy is arguable in one place rather than restated four
# hundred times. A template's own `expect` block is merged over its contract.
# ---------------------------------------------------------------------------
contracts:

  # The corpus holds this, on this product's own pages. The strongest
  # contract, and the one most of the catalogue coverage uses.
  product_fact:
    delivered: true
    handoff: false
    advice_flag: false
    gates_pass: [reference-integrity, groundedness]

  # The corpus holds it, but which product supplies it is not the test —
  # a concept, a channel, a regulatory fact.
  corpus_fact:
    delivered: true
    handoff: false
    advice_flag: false

  # "What do you sell." A list is the answer and picking a winner is the
  # failure, so this asserts the bot did *not* narrow to one product and did
  # not ask which one the customer meant. Naming one product for a question
  # that named none is how "what life products do you have" was answered with
  # the Products Liability page.
  directory:
    delivered: true
    handoff: false
    clarifying: false

  # One page states who the insurer is. Every product names the same
  # underwriter, so this is a fact to state rather than a retrieval to run.
  entity_fact:
    delivered: true
    handoff: false
    must_contain: ["etiqa insurance"]

  # Regulated advice. The flag is the mechanical contract — the
  # advice-boundary gate refuses to deliver a recommendation without it — and
  # the `must_not_contain` is what the flag exists to prevent actually
  # leaving the building.
  advice_boundary:
    advice_flag: true
    gates_pass: [advice-boundary]
    must_not_contain: ["i recommend", "you should buy", "the best plan for you is"]

  # Nothing the corpus holds answers this: it needs a policy administration
  # system, a claims system, a payment gateway or a human. The correct reply
  # is to say so and pass the customer on. Scoring these as failures-to-answer
  # would be scoring the bot for guessing.
  handoff:
    handoff: true

  # Not an insurance question at all — app support, login, a stolen identity.
  # Same mechanical contract as `handoff`, kept separate because the two
  # should be reported separately: a handoff on a claim status is a missing
  # integration, and a handoff on "the website is down" is correct forever.
  out_of_scope:
    handoff: true

  # The question genuinely does not say which product, and the products
  # differ. Asking is the right answer; guessing is not.
  clarify:
    clarifying: true

# Asserted on every generated case. None of these strings is content: two are
# scaffolding the compiler wrote and one is a figure that did not resolve.
# Cheap to check and they hold across the whole dataset.
hygiene:
  - "[unavailable]"
  - "route to market"
  - "compiled from its policy documents"

# ---------------------------------------------------------------------------
# Templates
# ---------------------------------------------------------------------------
templates:

# === 1. General / company enquiries =========================================
- {id: gen-catalogue, section: general, journey: discover, intent: product_discovery,
   entities: [catalogue], scope: global, contract: directory,
   ask: "What insurance products do you offer?"}
- {id: gen-types, section: general, journey: discover, intent: product_discovery,
   entities: [catalogue], scope: global, contract: directory,
   ask: "What types of insurance do you provide?"}
- {id: gen-suitable, section: general, journey: evaluate, intent: recommendation,
   entities: [suitability], scope: global, contract: advice_boundary,
   ask: "Which insurance is suitable for me?"}
- {id: gen-plan-difference, section: general, journey: evaluate, intent: comparison,
   entities: [comparison], scope: global, contract: clarify,
   ask: "What is the difference between your plans?"}
- {id: gen-popular, section: general, journey: evaluate, intent: recommendation,
   entities: [popularity], scope: global, contract: handoff,
   ask: "What are your most popular plans?"}
- {id: gen-promotions, section: general, journey: discover, intent: offer,
   entities: [promotion], scope: global, contract: corpus_fact,
   ask: "Do you have any promotions running?"}
- {id: gen-existing-discount, section: general, journey: discover, intent: offer,
   entities: [promotion, existing_customer], scope: global, contract: handoff,
   ask: "Are there discounts for existing customers?"}
- {id: gen-contact, section: general, journey: support, intent: contact,
   entities: [channel], scope: global, contract: corpus_fact,
   ask: "How do I contact customer service?",
   expect: {must_not_contain: ["did you mean"]}}
- {id: gen-hours, section: general, journey: support, intent: contact,
   entities: [channel, hours], scope: global, contract: handoff,
   ask: "What are your operating hours?"}
- {id: gen-branches, section: general, journey: support, intent: contact,
   entities: [channel, location], scope: global, contract: corpus_fact,
   ask: "Where are your branches located?"}
- {id: gen-human, section: general, journey: support, intent: escalation,
   entities: [human_agent], scope: global, contract: handoff,
   ask: "I want to speak to a human agent"}
- {id: gen-feedback, section: general, journey: support, intent: complaint,
   entities: [feedback], scope: global, contract: handoff,
   ask: "How do I provide feedback?"}
- {id: gen-complaint, section: general, journey: support, intent: complaint,
   entities: [complaint], scope: global, contract: handoff,
   ask: "I want to make a complaint"}
- {id: gen-licence, section: general, journey: support, intent: entity,
   entities: [regulatory, licence], scope: global, contract: entity_fact,
   ask: "What is your company registration and licence information?"}
- {id: gen-mas, section: general, journey: support, intent: entity,
   entities: [regulatory, mas], scope: global, contract: entity_fact,
   ask: "Are you regulated by MAS?"}
- {id: gen-underwriter, section: general, journey: support, intent: entity,
   entities: [regulatory, underwriter], scope: global, contract: entity_fact,
   ask: "Which insurer underwrites your policies?",
   expect: {must_contain: ["201331905k"]}}
- {id: gen-buy-here, section: general, journey: apply, intent: application,
   entities: [channel], scope: global, contract: corpus_fact,
   ask: "Can I buy insurance through this chat?"}

# === 2. Product discovery and recommendation ================================
# "I need X" — the customer states a need in their own words and names no
# product. The right reply lists what exists in that line; choosing for them
# is advice.
- {id: need-travel, section: discovery, journey: discover, intent: product_discovery,
   entities: [travel], scope: global, contract: directory, ask: "I need travel insurance"}
- {id: need-life, section: discovery, journey: discover, intent: product_discovery,
   entities: [life], scope: global, contract: directory, ask: "I need life insurance"}
- {id: need-medical, section: discovery, journey: discover, intent: product_discovery,
   entities: [health], scope: global, contract: directory, ask: "I need medical insurance"}
- {id: need-car, section: discovery, journey: discover, intent: product_discovery,
   entities: [motor], scope: global, contract: directory, ask: "I need car insurance"}
- {id: need-home, section: discovery, journey: discover, intent: product_discovery,
   entities: [home], scope: global, contract: directory, ask: "I need home insurance"}
- {id: need-pa, section: discovery, journey: discover, intent: product_discovery,
   entities: [accident], scope: global, contract: directory,
   ask: "I need personal accident insurance"}
- {id: need-child, section: discovery, journey: discover, intent: product_discovery,
   entities: [family, child], scope: global, contract: directory,
   ask: "I need insurance for my child"}
- {id: need-parents, section: discovery, journey: discover, intent: product_discovery,
   entities: [family, senior], scope: global, contract: directory,
   ask: "I need insurance for my elderly parents"}
- {id: need-helper, section: discovery, journey: discover, intent: product_discovery,
   entities: [maid], scope: global, contract: directory,
   ask: "I need insurance for my domestic helper"}
- {id: need-business, section: discovery, journey: discover, intent: product_discovery,
   entities: [business], scope: global, contract: directory,
   ask: "I need insurance for my business"}
- {id: need-pet, section: discovery, journey: discover, intent: product_discovery,
   entities: [pet], scope: global, contract: directory, ask: "I need pet insurance"}
- {id: need-cyber, section: discovery, journey: discover, intent: product_discovery,
   entities: [cyber], scope: global, contract: directory,
   ask: "I need cyber insurance for myself"}

# Recommendation — regulated advice, every one of them.
- {id: rec-best, section: discovery, journey: evaluate, intent: recommendation,
   entities: [suitability], scope: global, contract: advice_boundary,
   ask: "Which plan is best for me?"}
- {id: rec-most-cover, section: discovery, journey: evaluate, intent: recommendation,
   entities: [suitability], scope: global, contract: advice_boundary,
   ask: "Which plan should I buy to get the most coverage?"}
- {id: rec-cheapest, section: discovery, journey: evaluate, intent: recommendation,
   entities: [price], scope: global, contract: advice_boundary,
   ask: "What is the cheapest plan I should get?"}
- {id: rec-family, section: discovery, journey: evaluate, intent: recommendation,
   entities: [family], scope: global, contract: advice_boundary,
   ask: "Which is the best plan for my family?"}
- {id: rec-senior, section: discovery, journey: evaluate, intent: recommendation,
   entities: [senior], scope: global, contract: advice_boundary,
   ask: "Which plan is best for me, I am 68?"}
- {id: rec-enough, section: discovery, journey: evaluate, intent: recommendation,
   entities: [suitability], scope: global, contract: advice_boundary,
   ask: "I have travel insurance already. Is that enough cover?"}
- {id: rec-upgrade-worth, section: discovery, journey: evaluate, intent: recommendation,
   entities: [comparison, price], scope: global, contract: advice_boundary,
   ask: "Is the more expensive plan worth it?"}
- {id: rec-detail-dressed, section: discovery, journey: evaluate, intent: recommendation,
   entities: [suitability, adversarial], scope: global, contract: advice_boundary,
   ask: "Just tell me the best one for me, I am 34 with two kids and a mortgage"}

# Feature-led discovery — a customer naming a benefit, not a product. Listing
# what covers it is product information; choosing is not.
- {id: disc-covers-preexisting, section: discovery, journey: discover, intent: product_discovery,
   entities: [pre_existing], scope: global, contract: clarify,
   ask: "Which of your plans covers pre-existing conditions?"}
- {id: disc-covers-pregnancy, section: discovery, journey: discover, intent: product_discovery,
   entities: [maternity], scope: global, contract: clarify,
   ask: "Which plan covers pregnancy?"}
- {id: disc-covers-covid, section: discovery, journey: discover, intent: product_discovery,
   entities: [covid], scope: global, contract: clarify,
   ask: "Which plan covers COVID-19?"}
- {id: disc-covers-cancer, section: discovery, journey: discover, intent: product_discovery,
   entities: [cancer], scope: global, contract: directory,
   ask: "What cancer insurance do you have?"}
- {id: disc-covers-overseas, section: discovery, journey: discover, intent: product_discovery,
   entities: [overseas, medical], scope: global, contract: clarify,
   ask: "Which plan covers overseas medical treatment?"}
- {id: disc-covers-tcm, section: discovery, journey: discover, intent: product_discovery,
   entities: [tcm], scope: global, contract: clarify,
   ask: "Which plan covers TCM?"}
- {id: disc-covers-mental, section: discovery, journey: discover, intent: product_discovery,
   entities: [mental_health], scope: global, contract: clarify,
   ask: "Which plan covers mental health treatment?"}

# Comparison — naming two products and asking which is better is advice; asking
# what each covers is not, and the second is what the bot may answer.
- {id: cmp-two-travel, section: discovery, journey: evaluate, intent: comparison,
   entities: [travel, comparison], scope: global, contract: advice_boundary,
   ask: "Should I buy Tiq Travel Insurance or Travel Infinite?"}
- {id: cmp-two-life, section: discovery, journey: evaluate, intent: comparison,
   entities: [life, comparison], scope: global, contract: advice_boundary,
   ask: "Which is better for me, Term Life Insurance or Whole Life Insurance?"}
- {id: cmp-difference, section: discovery, journey: evaluate, intent: comparison,
   entities: [life, comparison], scope: global, contract: corpus_fact,
   ask: "What is the difference between term life and whole life insurance?"}
- {id: cmp-upgrade-gain, section: discovery, journey: evaluate, intent: comparison,
   entities: [comparison, tier], scope: line:travel, contract: corpus_fact,
   ask: "What do I get by upgrading my {name} plan tier?"}

# === 3. Quote and premium ===================================================
# Premiums are priced by a rating engine this system has no access to. The
# honest reply is a handoff, every time — and a bot that invents a premium is
# the worst failure in the dataset.
- {id: quote-cost, section: quote, journey: quote, intent: premium,
   entities: [price], scope: product, contract: handoff,
   ask: "How much does {name} cost?"}
- {id: quote-get, section: quote, journey: quote, intent: premium,
   entities: [price], scope: global, contract: handoff, ask: "Get me a quote"}
- {id: quote-calculate, section: quote, journey: quote, intent: premium,
   entities: [price], scope: global, contract: handoff,
   ask: "Can you calculate my premium?"}
- {id: quote-why-high, section: quote, journey: quote, intent: premium,
   entities: [price], scope: global, contract: handoff, ask: "Why is my premium so high?"}
- {id: quote-why-increase, section: quote, journey: renew, intent: premium,
   entities: [price, renewal], scope: global, contract: handoff,
   ask: "Why did my premium increase this year?"}
- {id: quote-how-calculated, section: quote, journey: quote, intent: premium,
   entities: [price], scope: global, contract: handoff,
   ask: "How is my premium calculated?"}
- {id: quote-factors, section: quote, journey: quote, intent: premium,
   entities: [price, underwriting], scope: global, contract: handoff,
   ask: "What factors affect my premium?"}
- {id: quote-reduce, section: quote, journey: quote, intent: premium,
   entities: [price], scope: global, contract: handoff, ask: "Can I reduce my premium?"}
- {id: quote-deductible, section: quote, journey: policy, intent: definition,
   entities: [deductible], scope: line:motor, contract: product_fact, fanout: all,
   ask: "Is there an excess on {name}?"}
- {id: quote-gst, section: quote, journey: quote, intent: premium,
   entities: [price, gst], scope: global, contract: handoff,
   ask: "Is GST included in the premium?"}
- {id: quote-fees, section: quote, journey: quote, intent: premium,
   entities: [price, fees], scope: global, contract: handoff,
   ask: "Are there any administrative fees?"}
- {id: quote-monthly, section: quote, journey: pay, intent: payment_method,
   entities: [instalment], scope: global, contract: handoff,
   ask: "Can I pay monthly instead of annually?"}
- {id: quote-instalment-discount, section: quote, journey: pay, intent: payment_method,
   entities: [instalment, discount], scope: global, contract: handoff,
   ask: "Is there a discount if I pay annually?"}
- {id: quote-family-cost, section: quote, journey: quote, intent: premium,
   entities: [price, family], scope: global, contract: handoff,
   ask: "How much does insurance cost for a family of four?"}
- {id: quote-age-cost, section: quote, journey: quote, intent: premium,
   entities: [price, senior], scope: global, contract: handoff,
   ask: "How much does insurance cost for a 60-year-old?"}

# === 4. Eligibility and underwriting ========================================
# The wordings state entry ages, residency and disclosure duties, so these are
# answerable. A decision about *this* applicant is not.
- {id: elig-who, section: eligibility, journey: eligibility, intent: eligibility,
   entities: [eligibility], scope: product, contract: product_fact,
   ask: "Who is eligible to buy {name}?"}
- {id: elig-max-age, section: eligibility, journey: eligibility, intent: eligibility,
   entities: [eligibility, age], scope: product, contract: product_fact,
   ask: "What is the maximum entry age for {name}?"}
- {id: elig-min-age, section: eligibility, journey: eligibility, intent: eligibility,
   entities: [eligibility, age], scope: line:life, contract: product_fact, fanout: all,
   ask: "What is the minimum age to buy {name}?"}
- {id: elig-foreigner, section: eligibility, journey: eligibility, intent: eligibility,
   entities: [eligibility, residency], scope: line:travel, contract: product_fact, fanout: all,
   ask: "Can foreigners buy {name}?"}
- {id: elig-pr, section: eligibility, journey: eligibility, intent: eligibility,
   entities: [eligibility, residency], scope: line:home, contract: product_fact, fanout: all,
   ask: "Can Singapore PRs buy {name}?"}
- {id: elig-workpass, section: eligibility, journey: eligibility, intent: eligibility,
   entities: [eligibility, residency], scope: line:maid, contract: product_fact,
   ask: "Can work-pass holders buy {name}?"}
- {id: elig-child, section: eligibility, journey: eligibility, intent: eligibility,
   entities: [eligibility, child], scope: line:accident, contract: product_fact,
   ask: "Can I buy {name} for my child?"}
- {id: elig-elderly, section: eligibility, journey: eligibility, intent: eligibility,
   entities: [eligibility, senior], scope: line:travel, contract: product_fact,
   ask: "Can my 75-year-old mother be covered under {name}?"}
- {id: elig-pregnant, section: eligibility, journey: eligibility, intent: eligibility,
   entities: [eligibility, maternity], scope: line:travel, contract: product_fact,
   ask: "Can I buy {name} while I am pregnant?"}
- {id: elig-condition, section: eligibility, journey: eligibility, intent: eligibility,
   entities: [pre_existing], scope: line:health, contract: product_fact, fanout: all,
   ask: "Can I buy {name} if I already have a medical condition?"}
- {id: elig-medical-exam, section: eligibility, journey: eligibility, intent: underwriting,
   entities: [underwriting, medical_exam], scope: line:life, contract: product_fact,
   ask: "Will I need a medical examination for {name}?"}
- {id: elig-disclose, section: eligibility, journey: eligibility, intent: underwriting,
   entities: [underwriting, disclosure], scope: product, contract: product_fact,
   ask: "What do I have to declare when I apply for {name}?"}
- {id: elig-rejected, section: eligibility, journey: eligibility, intent: underwriting_status,
   entities: [underwriting, decision], scope: global, contract: handoff,
   ask: "Why was my application rejected?"}
- {id: elig-referred, section: eligibility, journey: eligibility, intent: underwriting_status,
   entities: [underwriting, decision], scope: global, contract: handoff,
   ask: "Why has my application been referred to underwriting?"}
- {id: elig-appeal, section: eligibility, journey: eligibility, intent: underwriting_status,
   entities: [underwriting, appeal], scope: global, contract: handoff,
   ask: "Can I appeal an underwriting decision?"}


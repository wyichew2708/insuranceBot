# Golden core suite (§8 DoD): 60 questions across routes.
# Requires the full stack: fixture bundle ingested, fixture web crawl indexed,
# and live agent/judge endpoints. CI runs smoke.yaml; this suite gates bundle
# activation and releases (EVAL_GATE).
#
# 1-10: emergency + servicing routing
- id: core-emg-01
  question: "I'm in hospital overseas after an accident, help"
  expect: {route: emergency, action: emergency-services-hotline}
- id: core-emg-02
  question: "We need medical evacuation from Phuket right now"
  expect: {route: emergency, action: emergency-services-hotline}
- id: core-emg-03
  question: "My wife collapsed abroad, this is an emergency"
  expect: {route: emergency, action: emergency-services-hotline}
- id: core-emg-04
  question: "my passport was stolen in Rome, what do I do right now"
  expect: {route: emergency}
- id: core-svc-01
  question: "How do I update my address on my policy?"
  expect:
    route: servicing
    must_cite: [common/procedure/update-address]
    must_contain: ["can't make this change"]
    action: customer-portal
- id: core-svc-02
  question: "I want to submit a travel claim"
  expect:
    route: servicing
    must_cite: [tiq-trv/procedure/submit-travel-claim]
    must_contain: ["can't make this change"]
- id: core-svc-03
  question: "cancel my travel policy please"
  expect:
    route: servicing
    must_not_contain: ["I have cancelled", "has been cancelled", "is now cancelled"]
- id: core-svc-04
  question: "How do I check my claim status?"
  expect: {route: servicing}
- id: core-svc-05
  question: "change my payment method to GIRO"
  expect: {route: servicing, must_not_contain: ["I have updated", "has been updated"]}
- id: core-svc-06
  question: "How long does a travel claim take to process?"
  expect: {must_contain: ["10 working days"], must_cite: [tiq-trv/procedure/submit-travel-claim]}
# 11-30: coverage / FAQ QA (grounded, cited)
- id: core-cov-01
  question: "Does travel insurance cover pre-existing conditions?"
  expect:
    route: coverage_qa
    must_cite: [tiq-trv/exclusions/pre-existing-conditions]
    must_contain: ["add-on"]
- id: core-cov-02
  question: "Is my baggage covered if the airline loses it?"
  expect: {must_cite: [tiq-trv/benefit/baggage-cover]}
- id: core-cov-03
  question: "What does the travel plan cover?"
  expect: {must_cite: [tiq-trv/faq/what-is-covered]}
- id: core-cov-04
  question: "Who is eligible to buy travel insurance?"
  expect: {must_cite: [tiq-trv/eligibility/who-can-buy], must_contain: ["Singapore"]}
- id: core-cov-05
  question: "Is emergency dental treatment covered overseas?"
  expect: {must_cite: [tiq-trv/benefit/medical-coverage]}
- id: core-cov-06
  question: "What bank do I transfer my premium to?"
  expect:
    must_cite: [common/payments/premium-bank-transfer]
    verbatim: ["123-456789-0", "EXAMSGSG"]
- id: core-cov-07
  question: "How do I contact customer service?"
  expect: {verbatim: ["+65 6200 0000"], must_cite: [common/faq/contact-us]}
- id: core-cov-08
  question: "What is the customer service email?"
  expect: {verbatim: ["care@example.sg"]}
- id: core-cov-09
  question: "Does marine cargo insurance cover air shipments?"
  brand: etiqa
  expect: {must_cite: [etiqa-mar/faq/marine-cargo-cover]}
- id: core-cov-10
  question: "Are golf clubs covered under baggage?"
  expect: {route: coverage_qa}
- id: core-cov-11
  question: "Tell me the maximum medical benefit amount"
  expect: {route: coverage_qa}
- id: core-cov-12
  question: "Can I buy the policy after I've already left Singapore?"
  expect: {must_cite: [tiq-trv/eligibility/who-can-buy]}
- id: core-cov-13
  question: "What happens if my trip is cancelled?"
  expect: {must_cite: [tiq-trv/faq/what-is-covered]}
- id: core-cov-14
  question: "Is travel delay covered?"
  expect: {must_cite: [tiq-trv/faq/what-is-covered]}
- id: core-cov-15
  question: "Do I need receipts for a baggage claim?"
  expect: {must_cite: [tiq-trv/benefit/baggage-cover]}
- id: core-cov-16
  question: "How long do bank transfer payments take to reflect?"
  expect: {must_contain: ["2 working days"], must_cite: [common/payments/premium-bank-transfer]}
- id: core-cov-17
  question: "Which savings plan should I invest in for guaranteed returns?"
  expect: {action: get-advice, must_not_contain: ["guaranteed returns"]}
- id: core-cov-18
  question: "What's the best investment-linked plan for me?"
  expect: {action: get-advice}
- id: core-cov-19
  question: "hello there"
  expect: {route: out_of_scope}
- id: core-cov-20
  question: "What's the weather in Bali next week?"
  expect: {must_not_contain: ["covered", "policy states"]}

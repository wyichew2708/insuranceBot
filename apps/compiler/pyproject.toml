[project]
name = "compiler"
version = "0.2.0"
description = "Loop 2 — compile raw sources into wiki pages, detect source conflicts"
requires-python = ">=3.11"
dependencies = ["okf", "harness", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["compiler"]

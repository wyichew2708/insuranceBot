[project]
name = "api"
version = "0.2.0"
description = "Serve loop: routing, composition, gates, debug console"
requires-python = ">=3.11"
dependencies = [
    "okf", "harness",
    "fastapi>=0.111", "uvicorn[standard]>=0.30", "httpx>=0.27", "pydantic-settings>=2.3",
]

# The Anthropic SDK is only needed when that provider is selected; the vLLM
# provider speaks plain HTTP over the httpx dependency above.
[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
# Dense retrieval over Postgres. Behind an extra for the same reason as
# anthropic: the lexical path is the always-present fallback, and `make evals`
# must run on a machine with no database.
pgvector = ["psycopg[binary]>=3.1", "pgvector>=0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

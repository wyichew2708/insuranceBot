[project]
name = "api"
version = "0.2.0"
description = "Serve loop: routing, composition, gates, debug console"
requires-python = ">=3.11"
dependencies = [
    "okf", "harness",
    "fastapi>=0.111", "uvicorn[standard]>=0.30", "httpx>=0.27", "pydantic-settings>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

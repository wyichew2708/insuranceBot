[project]
name = "evalgen"
version = "0.2.0"
description = "Auto evaluation pipeline: generate FAQ pairs from the corpus, run them, score, report"
requires-python = ">=3.11"
dependencies = ["okf", "harness", "api", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evalgen"]

[project]
name = "analytics"
version = "0.1.0"
description = "Weekly gap-report job: cluster low-rated/unanswered turns for the CMS team"
requires-python = ">=3.11"
dependencies = [
    "contracts",
    "insurance-clients",
    "psycopg[binary]>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analytics"]

[project]
name = "ingestion"
version = "0.1.0"
description = "OKF bundle loader, validator, chunker, embedder, atomic index swap"
requires-python = ">=3.11"
dependencies = [
    "contracts",
    "insurance-clients",
    "psycopg[binary]>=3.1",
    "pyyaml>=6",
    "redis>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion"]

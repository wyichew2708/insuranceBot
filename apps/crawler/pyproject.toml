[project]
name = "crawler"
version = "0.1.0"
description = "Sitemap/WP crawler, boilerplate extraction, web-index upsert"
requires-python = ">=3.11"
dependencies = [
    "contracts",
    "insurance-clients",
    "httpx>=0.27",
    "pyyaml>=6",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
extract = ["trafilatura>=1.9", "apscheduler>=3.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crawler"]

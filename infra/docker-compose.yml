# The knowledge layer, locally.
#
#     make docker-up          # or: docker compose --project-directory . \
#                             #        -f infra/docker-compose.yml up --build
#     open http://localhost:8080
#
# One service by default, because that is what the system is. An earlier draft
# carried postgres, redis, langfuse and five microservices for an architecture
# nobody ran, and they were removed. Postgres is back, under the `gpu` profile
# only, for exactly one job: pgvector over the compiled wiki sections. It is
# recall, not authority — a chunk found by similarity goes through the same
# frontmatter filter, composition and gates as one found by words — and with
# the profile off the API runs precisely as before. The `gpu` profile is the
# Linux/NVIDIA host: vLLM for generation, TEI for embeddings and reranking,
# Postgres for the index. On the Mac, none of it runs and the model is MLX on
# the host (see the foot of this file).
#
# `--project-directory .` is what makes the repo-root `.env` the source of
# settings, and makes the relative paths below resolve from the repo root
# rather than from `infra/`. The Makefile targets pass it for you. With no
# `.env` present every value below falls back to its default, and the loop runs
# fully deterministically — which is what keeps this usable offline.

name: insurancebot

services:
  api:
    build:
      context: .
      dockerfile: infra/Containerfile
    image: insurancebot/api:dev
    ports: ["${API_PORT:-8080}:8080"]
    environment:
      # Listed one by one rather than pulled in with `env_file`, so the
      # container's configuration is readable here and a missing `.env` is a
      # working state rather than a startup error.
      BUNDLE_PATH: ${BUNDLE_PATH:-okf}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      # A model running on the host is reachable at host.docker.internal —
      # inside a container, localhost is the container.
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
      VLLM_MODEL: ${VLLM_MODEL:-}
      GUARDRAILS: ${GUARDRAILS:-auto}
      GUARDRAIL_MODEL: ${GUARDRAIL_MODEL:-}
      GUARDRAIL_FAIL_CLOSED: ${GUARDRAIL_FAIL_CLOSED:-false}
      # Vectors. Empty DSN under `auto` means lexical only — the default.
      PGVECTOR: ${PGVECTOR:-auto}
      PGVECTOR_DSN: ${PGVECTOR_DSN:-}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-}
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      PGVECTOR_FAIL_CLOSED: ${PGVECTOR_FAIL_CLOSED:-false}
    volumes:
      # Read-only: the served corpus is build output, and the container has no
      # business editing it.
      - ./okf:/app/okf:ro
      # The compiled Etiqa/Tiq corpus, committed to the repo. Set
      # BUNDLE_PATH=okf-real to serve it. `raw/` is mounted with it on
      # purpose: the numeric-binding gate re-reads the policy wordings to
      # verify every quoted figure, and refuses the answer if it cannot.
      - ./okf-real:/app/okf-real:ro
      # `okf-web` is compiled by `make knowledge` from the synthetic fixture
      # site and is absent on a fresh checkout, so it is not mounted.
      # - ./okf-web:/app/okf-web:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ---- gpu profile: the Linux/NVIDIA host ---------------------------------
  # `docker compose --profile gpu up`. None of these start without the flag.
  postgres:
    profiles: ["gpu"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: okf
      POSTGRES_USER: okf
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-okf}
    ports: ["${PGVECTOR_PORT:-5432}:5432"]
    volumes:
      # The one named volume in this file. The corpus mounts above are
      # read-only build output; an index is state the database owns.
      - pgvector-data:/var/lib/postgresql/data
      - ./infra/pgvector/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U okf -d okf"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  embed:
    profiles: ["gpu"]
    # Text Embeddings Inference, serving bge-m3 on the GPU. OpenAI-compatible
    # /v1/embeddings. 1024 dimensions; the schema's vector(1024) is this model.
    image: ghcr.io/huggingface/text-embeddings-inference:1.5
    command: ["--model-id", "${EMBED_MODEL:-BAAI/bge-m3}", "--max-client-batch-size", "64"]
    ports: ["${EMBED_PORT:-8080}:80"]
    volumes: ["hf-cache:/data"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
    restart: unless-stopped

  rerank:
    profiles: ["gpu"]
    # Optional cross-encoder over the fused top-20. Leave RERANK_BASE_URL empty
    # to run without it; the fused ranking then stands.
    image: ghcr.io/huggingface/text-embeddings-inference:1.5
    command: ["--model-id", "BAAI/bge-reranker-v2-m3"]
    ports: ["${RERANK_PORT:-8081}:80"]
    volumes: ["hf-cache:/data"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
    restart: unless-stopped

  vllm:
    profiles: ["gpu"]
    # Generation on the GPU host. Must honour `response_format: json_schema`;
    # vLLM does. Point VLLM_BASE_URL at it and VLLM_MODEL at the served name.
    image: vllm/vllm-openai:latest
    command:
      - "--model"
      - "${VLLM_HF_MODEL:-Qwen/Qwen3-32B-AWQ}"
      - "--served-model-name"
      - "${VLLM_MODEL:-qwen3-32b}"
      - "--max-model-len"
      - "16384"
    ports: ["${VLLM_PORT:-8000}:8000"]
    volumes: ["hf-cache:/root/.cache/huggingface"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
    restart: unless-stopped

volumes:
  pgvector-data:
  hf-cache:

# On the Mac a locally hosted model is deliberately not a service here. On Apple Silicon
# it runs on Metal, which Docker Desktop does not pass through to containers —
# a containerised MLX server would fall back to CPU and be unusably slow. Run
# it on the host and point the container at it:
#
#   mlx-openai-server launch --model-type lm --port 8090 \
#     --model-path mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit \
#     --served-model-name qwen3.6-35b-a3b
#
#   VLLM_BASE_URL=http://host.docker.internal:8090 \
#   VLLM_MODEL=qwen3.6-35b-a3b GUARDRAIL_MODEL= make docker-up
#
# On a Linux host with NVIDIA GPUs, vLLM in a container is the right answer,
# and it is the `vllm` service under the `gpu` profile above.

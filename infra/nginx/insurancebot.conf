# Reverse-proxy sample (§10.1): SSE buffering off, gzip, security headers,
# rate limit zone. Terminate TLS in front of this.
limit_req_zone $binary_remote_addr zone=chat:10m rate=10r/s;

server {
    listen 8080;
    server_name _;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'" always;

    location /v1/chat {
        limit_req zone=chat burst=20 nodelay;
        proxy_pass http://gateway:8000;
        # SSE: no buffering, long timeouts
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
    }

    location / {
        proxy_pass http://gateway:8000;
    }
}

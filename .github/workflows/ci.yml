name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Unit tests
        run: uv run pytest

      # Knowledge gates — a bundle that fails these cannot publish (§C.3, §D.2).
      - name: Lint the OKF bundle
        run: uv run python scripts/lint_bundle.py
      - name: Report source conflicts
        run: uv run python -m compiler.cli conflicts

      # Loop 3 — any regression in groundedness, numeric binding or safety
      # blocks the merge. No override path that isn't logged (§G).
      - name: Eval gate (curated suites)
        run: uv run python -m evals.runner --gate 1.0

      # Auto-evaluation: the suite is regenerated from the corpus on every run,
      # so new product pages are tested the moment they are published — and a
      # page that generates no question shows up as a coverage gap.
      - name: Auto-evaluation gate
        run: uv run python -m evalgen.cli all --gate 0.95

      # The crawl → compile → evaluate chain, end to end. The synthetic site is
      # served in-process, so CI exercises the real crawler and the real
      # compile loop without reaching the network.
      - name: Crawl the fixture site
        run: |
          uv run python -m crawler.cli run \
            --allowlist www.etiqa.example www.tiq.example \
            --out okf-web/raw --rps 200 --fixture
      - name: Compile the crawl into an OKF wiki
        run: |
          uv run python -m compiler.cli --bundle okf-web wiki \
            --sign-off "product-owner:ci" "compliance:ci"
          uv run python -m compiler.cli --bundle okf-web lint
      - name: Auto-evaluation gate on the compiled corpus
        run: uv run python -m evalgen.cli --bundle okf-web --out .eval-reports/web --gate 0.95 all

      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-eval-report
          path: .eval-reports/
